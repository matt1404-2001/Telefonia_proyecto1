<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #4b5563; }
      .class-box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 8; }
      .class-head { fill: #dbeafe; stroke: #1f2937; stroke-width: 2; }
      .repo-head { fill: #dcfce7; stroke: #1f2937; stroke-width: 2; }
      .model-head { fill: #fef3c7; stroke: #1f2937; stroke-width: 2; }
      .class-name { font: 700 17px Arial, sans-serif; fill: #111827; }
      .member { font: 400 14px Consolas, monospace; fill: #111827; }
      .section-line { stroke: #1f2937; stroke-width: 1.4; }
      .rel { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dep { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
      .label { font: 600 13px Arial, sans-serif; fill: #374151; }
      .legend { font: 400 14px Arial, sans-serif; fill: #374151; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1500" height="1050" fill="#f9fafb"/>

  <text x="750" y="46" text-anchor="middle" class="title">Diagrama de Clases - Proveedor Java</text>
  <text x="750" y="74" text-anchor="middle" class="subtitle">Clases principales del proveedor telefonico XYZ</text>

  <!-- SocketServidor -->
  <g transform="translate(60,140)">
    <rect width="300" height="205" class="class-box"/>
    <rect width="300" height="42" class="class-head"/>
    <text x="150" y="27" text-anchor="middle" class="class-name">SocketServidor</text>
    <line x1="0" y1="98" x2="300" y2="98" class="section-line"/>
    <text x="14" y="66" class="member">- int puerto</text>
    <text x="14" y="86" class="member">- BitacoraAsync bitacora</text>
    <text x="14" y="126" class="member">+ SocketServidor()</text>
    <text x="14" y="146" class="member">+ iniciarServidor(): void</text>
    <text x="14" y="166" class="member">- manejarCliente(Socket): void</text>
  </g>

  <!-- MensajeControlador -->
  <g transform="translate(430,110)">
    <rect width="350" height="265" class="class-box"/>
    <rect width="350" height="42" class="class-head"/>
    <text x="175" y="27" text-anchor="middle" class="class-name">MensajeControlador</text>
    <line x1="0" y1="78" x2="350" y2="78" class="section-line"/>
    <text x="14" y="66" class="member">- ProveedorServicio servicio</text>
    <text x="14" y="106" class="member">+ procesarMensaje(String): String</text>
    <text x="14" y="126" class="member">- procesarVerificacionSaldo(JSONObject)</text>
    <text x="14" y="146" class="member">  : JSONObject</text>
    <text x="14" y="166" class="member">- procesarRegistroLlamada(JSONObject)</text>
    <text x="14" y="186" class="member">  : JSONObject</text>
    <text x="14" y="206" class="member">- obtenerDuracionEnSegundos(JSONObject)</text>
    <text x="14" y="226" class="member">  : int</text>
    <text x="14" y="246" class="member">- respuestaError(): JSONObject</text>
  </g>

  <!-- ProveedorServicio -->
  <g transform="translate(850,95)">
    <rect width="560" height="310" class="class-box"/>
    <rect width="560" height="42" class="class-head"/>
    <text x="280" y="27" text-anchor="middle" class="class-name">ProveedorServicio</text>
    <line x1="0" y1="118" x2="560" y2="118" class="section-line"/>
    <text x="14" y="66" class="member">- CuentaRepositorio cuentaRepo</text>
    <text x="14" y="86" class="member">- TarifaRepositorio tarifaRepo</text>
    <text x="14" y="106" class="member">- LlamadaRepositorio llamadaRepo</text>
    <text x="14" y="146" class="member">+ verificarSaldo(String, int, int, String): JSONObject</text>
    <text x="14" y="166" class="member">+ registrarLlamada(String, int, int, String, long, int): JSONObject</text>
    <text x="14" y="186" class="member">- consultarSaldo(Cuenta): JSONObject</text>
    <text x="14" y="206" class="member">- autorizarLlamada(Cuenta, int, String): JSONObject</text>
    <text x="14" y="226" class="member">- determinarTipoDestino(String, int): String</text>
    <text x="14" y="246" class="member">- extraerPrefijo(String): String</text>
    <text x="14" y="266" class="member">- calcularTiempoDisponible(double, double): String</text>
    <text x="14" y="286" class="member">- formatearTarifa(long): String</text>
  </g>

  <!-- Repositories -->
  <g transform="translate(110,500)">
    <rect width="330" height="155" class="class-box"/>
    <rect width="330" height="42" class="repo-head"/>
    <text x="165" y="27" text-anchor="middle" class="class-name">CuentaRepositorio</text>
    <line x1="0" y1="56" x2="330" y2="56" class="section-line"/>
    <text x="14" y="86" class="member">+ obtenerPorTelefono(String): Cuenta</text>
    <text x="14" y="108" class="member">+ actualizarSaldo(String, double)</text>
    <text x="14" y="128" class="member">  : boolean</text>
  </g>

  <g transform="translate(585,500)">
    <rect width="330" height="155" class="class-box"/>
    <rect width="330" height="42" class="repo-head"/>
    <text x="165" y="27" text-anchor="middle" class="class-name">TarifaRepositorio</text>
    <line x1="0" y1="56" x2="330" y2="56" class="section-line"/>
    <text x="14" y="86" class="member">+ obtenerTarifa(int, String, String)</text>
    <text x="14" y="106" class="member">  : Tarifa</text>
    <text x="14" y="128" class="member">- obtenerGrupoDesdeBD(String): String</text>
  </g>

  <g transform="translate(1060,500)">
    <rect width="330" height="155" class="class-box"/>
    <rect width="330" height="42" class="repo-head"/>
    <text x="165" y="27" text-anchor="middle" class="class-name">LlamadaRepositorio</text>
    <line x1="0" y1="56" x2="330" y2="56" class="section-line"/>
    <text x="14" y="88" class="member">+ registrarLlamada(Llamada)</text>
    <text x="14" y="108" class="member">  : boolean</text>
  </g>

  <!-- Models -->
  <g transform="translate(110,765)">
    <rect width="330" height="215" class="class-box"/>
    <rect width="330" height="42" class="model-head"/>
    <text x="165" y="27" text-anchor="middle" class="class-name">Cuenta</text>
    <line x1="0" y1="136" x2="330" y2="136" class="section-line"/>
    <text x="14" y="66" class="member">- String numeroTelefono</text>
    <text x="14" y="86" class="member">- String tipoServicio</text>
    <text x="14" y="106" class="member">- double saldo</text>
    <text x="14" y="126" class="member">- String proveedor</text>
    <text x="14" y="164" class="member">+ getters / setters</text>
    <text x="14" y="186" class="member">+ esPostpago(): boolean</text>
  </g>

  <g transform="translate(585,765)">
    <rect width="330" height="215" class="class-box"/>
    <rect width="330" height="42" class="model-head"/>
    <text x="165" y="27" text-anchor="middle" class="class-name">Tarifa</text>
    <line x1="0" y1="116" x2="330" y2="116" class="section-line"/>
    <text x="14" y="66" class="member">- int tipoLlamada</text>
    <text x="14" y="86" class="member">- String destinoGrupo</text>
    <text x="14" y="106" class="member">- double costoPorMinuto</text>
    <text x="14" y="144" class="member">+ getters / setters</text>
  </g>

  <g transform="translate(1060,735)">
    <rect width="330" height="245" class="class-box"/>
    <rect width="330" height="42" class="model-head"/>
    <text x="165" y="27" text-anchor="middle" class="class-name">Llamada</text>
    <line x1="0" y1="176" x2="330" y2="176" class="section-line"/>
    <text x="14" y="66" class="member">- String telefonoOrigen</text>
    <text x="14" y="86" class="member">- int fecha</text>
    <text x="14" y="106" class="member">- int hora</text>
    <text x="14" y="126" class="member">- String telefonoDestino</text>
    <text x="14" y="146" class="member">- long costoTotal</text>
    <text x="14" y="166" class="member">- int duracionSegundos</text>
    <text x="14" y="204" class="member">+ getters / setters</text>
  </g>

  <!-- Relations -->
  <path d="M360,242 C388,242 402,242 430,242" class="rel"/>
  <text x="395" y="225" text-anchor="middle" class="label">usa</text>

  <path d="M780,242 C810,242 820,242 850,242" class="rel"/>
  <text x="815" y="225" text-anchor="middle" class="label">delega</text>

  <path d="M990,405 C840,455 520,455 315,500" class="rel"/>
  <text x="690" y="438" text-anchor="middle" class="label">cuentaRepo</text>

  <path d="M1120,405 C1020,455 850,455 750,500" class="rel"/>
  <text x="955" y="438" text-anchor="middle" class="label">tarifaRepo</text>

  <path d="M1245,405 C1275,445 1270,470 1225,500" class="rel"/>
  <text x="1312" y="455" text-anchor="middle" class="label">llamadaRepo</text>

  <path d="M275,655 C275,700 275,720 275,765" class="rel"/>
  <text x="326" y="713" text-anchor="middle" class="label">retorna/actualiza</text>

  <path d="M750,655 C750,700 750,720 750,765" class="rel"/>
  <text x="800" y="713" text-anchor="middle" class="label">retorna</text>

  <path d="M1225,655 C1225,685 1225,705 1225,735" class="rel"/>
  <text x="1278" y="700" text-anchor="middle" class="label">persiste</text>

  <path d="M850,330 C690,390 475,675 345,765" class="dep"/>
  <text x="570" y="580" text-anchor="middle" class="label">usa Cuenta</text>

  <path d="M1020,405 C950,520 855,675 785,765" class="dep"/>
  <text x="920" y="610" text-anchor="middle" class="label">usa Tarifa</text>

  <path d="M1165,405 C1185,520 1205,640 1220,735" class="dep"/>
  <text x="1265" y="605" text-anchor="middle" class="label">crea Llamada</text>

  <!-- Legend -->
  <g transform="translate(60,94)">
    <line x1="0" y1="0" x2="58" y2="0" class="rel"/>
    <text x="72" y="5" class="legend">relacion directa</text>
    <line x1="210" y1="0" x2="268" y2="0" class="dep"/>
    <text x="282" y="5" class="legend">dependencia/uso</text>
  </g>
</svg>
